name: 桌面版检查
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装依赖
        run: npm ci
      - name: 前端类型检查和测试
        run: |
          npm run typecheck
          npm run test:web
      - name: Java 内核及伪串口测试
        run: npm run test:backend
      - name: 构建桌面应用
        run: npm run desktop:build
